apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dagster
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://dagster-io.github.io/helm'
      chart: dagster
      targetRevision: 1.13.19
      helm:
        valueFiles:
          - $valuesRepo/kubernetes/values/dagster-values.yaml
    - repoURL: 'https://github.com/tjrohweder/lab-k8s.git'
      targetRevision: HEAD
      ref: valuesRepo
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dagster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dagster-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tjrohweder/lab-k8s.git'
    targetRevision: HEAD
    path: kubernetes/manifests/dagster
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
